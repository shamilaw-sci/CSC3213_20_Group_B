services:
  # =========================================
  # NEXT.JS APPS
  # =========================================

  main-site:
    container_name: main-site

    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        APP_NAME: main-site

    ports:
      - '3001:3001'

    volumes:
      - .:/workspace
      - /workspace/node_modules

    environment:
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'

    restart: unless-stopped

  portal:
    container_name: portal-site

    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        APP_NAME: portal

    ports:
      - '3002:3002'

    volumes:
      - .:/workspace
      - /workspace/node_modules

    environment:
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'

    restart: unless-stopped

  people:
    container_name: people-site

    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        APP_NAME: people

    ports:
      - '3003:3003'

    volumes:
      - .:/workspace
      - /workspace/node_modules

    environment:
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'

    restart: unless-stopped

  projects:
    container_name: projects-site

    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        APP_NAME: projects

    ports:
      - '3004:3004'

    volumes:
      - .:/workspace
      - /workspace/node_modules

    environment:
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'

    restart: unless-stopped

  # =========================================
  # HONO / BUN APPS
  # =========================================

  api:
    container_name: api-server

    build:
      context: .
      dockerfile: docker/hono.Dockerfile
      args:
        APP_NAME: api

    ports:
      - '3000:3000'

    volumes:
      - .:/workspace
      - /workspace/node_modules

    restart: unless-stopped

  github-app:
    container_name: github-app

    build:
      context: .
      dockerfile: docker/hono.Dockerfile
      args:
        APP_NAME: github-app

    ports:
      - '8789:8789'

    volumes:
      - .:/workspace
      - /workspace/node_modules

    restart: unless-stopped

  # =========================================
  # CLOUDFLARE WORKERS
  # =========================================

  auth-worker:
    container_name: auth-worker

    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        APP_NAME: auth-worker

    ports:
      - '8787:8787'

    volumes:
      - .:/workspace
      - /workspace/node_modules

    environment:
      NODE_OPTIONS: ''

    restart: unless-stopped

  proxy-worker:
    container_name: proxy-worker

    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        APP_NAME: proxy-worker

    ports:
      - '8788:8788'

    volumes:
      - .:/workspace
      - /workspace/node_modules

    environment:
      NODE_OPTIONS: ''

    restart: unless-stopped
