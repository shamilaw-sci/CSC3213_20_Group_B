name: Migrate API D1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "apply scs-portal-auth migrations" to continue
        required: true
        type: string

concurrency:
  group: migrate-api-d1-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "apply scs-portal-auth migrations"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify API before migration
        run: |
          bun --filter '@scs/api' lint
          bun --filter '@scs/api' typecheck
          bun --filter '@scs/api' typecheck:test
          bun --filter '@scs/api' test
          bun --filter '@scs/api' build

      - name: Show pending D1 migrations
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations list scs-portal-auth --remote

      - name: Apply D1 migrations
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply scs-portal-auth --remote
