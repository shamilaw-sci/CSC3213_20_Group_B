name: Create Release (Mirror Repo)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'shamilaw-sci/CSC3213_20_Group_B'
    runs-on: ubuntu-latest
    env:
      RELEASE_BASE: '${{ github.event.repository.name }}-${{ github.ref_name }}'
      RELEASE_FILE: '${{ github.event.repository.name }}-${{ github.ref_name }}.zip'

    steps:
      - name: Checkout with submodules (with access)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.TARGET_TOKEN }}

      - name: Ensure submodules are pulled
        run: git submodule update --init --recursive

      - name: Zip project
        run: zip -r "$RELEASE_FILE" . -x ".git/*" ".github/*"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_BASE }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.RELEASE_FILE }}
