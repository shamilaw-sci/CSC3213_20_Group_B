name: Monorepo CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Restore dependency and build caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate documentation
        run: bun run docs:check

      - name: Test repository policies
        run: bun run test:repo

      - name: Check unused code and dependencies
        run: bun run knip

      - name: Validate formatting
        run: bun run format:check

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint

      - name: Verify affected workspaces
        if: github.event_name == 'pull_request'
        run: bunx turbo run lint typecheck typecheck:test test build --affected

      - name: Verify complete monorepo
        if: github.event_name != 'pull_request'
        run: |
          bun run lint
          bun run typecheck
          bun run typecheck:test
          bun run test
          bun run build
