openapi: 3.1.0
info:
  title: SCS PDN API
  version: 1.0.0
  description: Compact OpenAPI-style specification derived from the current API codebase.
servers:
  - url: https://api.scs-pdn.space
tags:
  - name: Auth
  - name: OAuth
  - name: Profile
  - name: People
  - name: Projects
  - name: Admin
  - name: Passkeys
  - name: Proxy
paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Create permission record and return a JWT
      parameters:
        - $ref: '#/components/parameters/XClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: JWT token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorObject'
                  - $ref: '#/components/schemas/CodeMessageError'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
  /auth/magic-code:
    post:
      tags: [Auth]
      summary: Send a one-time magic code by email
      parameters:
        - $ref: '#/components/parameters/XClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicCodeRequest'
      responses:
        '200':
          description: Magic code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicCodeSentResponse'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Mailer failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
  /auth/magic-code/verify:
    post:
      tags: [Auth]
      summary: Verify a magic code and start a session
      parameters:
        - $ref: '#/components/parameters/XClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicCodeVerifyRequest'
      responses:
        '200':
          description: Magic code verified and session cookie issued
          headers:
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerifiedResponse'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorObject'
                  - $ref: '#/components/schemas/CodeMessageError'
        '401':
          description: Invalid code
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorObject'
                  - $ref: '#/components/schemas/CodeMessageError'
        '403':
          description: Unauthorized client ID
          content:
            text/plain:
              schema:
                type: string
  /auth/verify:
    get:
      tags: [Auth]
      summary: Verify a JWT session cookie
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Session is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          description: Missing client context
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing, invalid, or revoked token
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Unauthorized client ID
          content:
            text/plain:
              schema:
                type: string
  /auth/logout:
    get:
      tags: [Auth]
      summary: Logout and clear cookies
      responses:
        '200':
          description: Logout completed
    post:
      tags: [Auth]
      summary: Logout and clear cookies
      responses:
        '200':
          description: Logout completed
    patch:
      tags: [Auth]
      summary: Logout and clear cookies
      responses:
        '200':
          description: Logout completed
  /auth/google:
    get:
      tags: [OAuth]
      summary: Start Google OAuth
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          example: portal
        - name: signup
          in: query
          required: false
          schema:
            type: string
          example: 'true'
        - name: prompt
          in: query
          required: false
          schema:
            type: string
          example: select_account
      responses:
        '302':
          description: Redirect to Google with oauth_state cookie set
          headers:
            Location:
              schema:
                type: string
        '400':
          description: Missing or invalid client_id
          content:
            text/plain:
              schema:
                type: string
  /auth/google/callback:
    get:
      tags: [OAuth]
      summary: Handle Google OAuth callback
      responses:
        '302':
          description: Redirect to dashboard or login error page
          headers:
            Location:
              schema:
                type: string
        '400':
          description: Missing state
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Invalid or expired state
          content:
            text/plain:
              schema:
                type: string
  /auth/github:
    get:
      tags: [OAuth]
      summary: Start GitHub OAuth
      parameters:
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
          example: https://portal.scs-pdn.space/login
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          example: portal
      responses:
        '302':
          description: Redirect to GitHub or error redirect_uri
          headers:
            Location:
              schema:
                type: string
        '400':
          description: Missing redirect_uri
          content:
            text/plain:
              schema:
                type: string
  /auth/github/callback:
    get:
      tags: [OAuth]
      summary: Handle GitHub OAuth callback
      responses:
        '302':
          description: Redirect to dashboard or login error page
          headers:
            Location:
              schema:
                type: string
        '400':
          description: Missing state
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Invalid or expired state
          content:
            text/plain:
              schema:
                type: string
  /api/me:
    get:
      tags: [Profile]
      summary: Get current user profile and permission flags
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Missing client ID
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid session
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: User not found
          content:
            text/plain:
              schema:
                type: string
    patch:
      tags: [Profile]
      summary: Update current user profile and profile picture source
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
      responses:
        '200':
          description: Updated profile fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  picture:
                    type: string
                    description: Resolved profile picture URL
                  pictureMode:
                    oneOf:
                      - $ref: '#/components/schemas/ProfilePictureMode'
                      - type: 'null'
                  gravatarMail:
                    oneOf:
                      - type: string
                      - type: 'null'
        '400':
          description: Invalid name, picture mode, or picture URL. Manual picture URLs are verified by image content type and may be PNG, JPEG, or WebP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/me/notifications:
    patch:
      tags: [Profile]
      summary: Update notification preferences
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPatchRequest'
      responses:
        '200':
          description: Updated
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Missing client context
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: User not found
          content:
            text/plain:
              schema:
                type: string
  /api/user/permissions:
    patch:
      tags: [Profile]
      summary: Update a user's permission record
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPermissionPatchRequest'
      responses:
        '200':
          description: Updated
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: User not found
          content:
            text/plain:
              schema:
                type: string
  /api/me/oauth/github:
    delete:
      tags: [Profile]
      summary: Remove linked GitHub OAuth state
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Removed
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Missing client context
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: User not found
          content:
            text/plain:
              schema:
                type: string
  /api/people/v2/me:
    get:
      tags: [People]
      summary: Get the signed-in user's public people profile JSON
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Current public profile, or null when no user JSON exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: 'null'
                required: [profile]
        '401':
          description: Missing or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
  /api/people/v2/me/schema:
    get:
      tags: [People]
      summary: Get allowed public profile kinds for the signed-in user
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Allowed profile submission metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfileSchemaResponse'
        '401':
          description: Missing or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
  /api/people/v2/me/pr:
    get:
      tags: [People]
      summary: Get public profile PR status for the signed-in user
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Latest profile PR state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfilePrStatus'
        '401':
          description: Missing or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
    put:
      tags: [People]
      summary: Create or update the signed-in user's public profile PR
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicProfilePrRequest'
      responses:
        '200':
          description: Open profile PR state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfilePrStatus'
        '400':
          description: Invalid profile body or schema validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
        '401':
          description: Missing or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden profile kind or identity mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
    post:
      tags: [People]
      summary: Same as PUT /api/people/v2/me/pr
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicProfilePrRequest'
      responses:
        '200':
          description: Open profile PR state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfilePrStatus'
  /api/projects/v2/projects/{slug}:
    get:
      tags: [Projects]
      summary: Get one public project metadata record
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/ProjectSlug'
      responses:
        '200':
          description: Project metadata, or null when no project file exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProjectResponse'
  /api/projects/v2/projects/{slug}/schema:
    get:
      tags: [Projects]
      summary: Get public project submission metadata for the signed-in user
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/ProjectSlug'
      responses:
        '200':
          description: Project submission metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProjectSchemaResponse'
  /api/projects/v2/projects/{slug}/pr:
    get:
      tags: [Projects]
      summary: Get project metadata PR status
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/ProjectSlug'
      responses:
        '200':
          description: Latest project PR state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProjectPrStatus'
    put:
      tags: [Projects]
      summary: Create or update a project metadata PR
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/ProjectSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicProjectPrRequest'
      responses:
        '200':
          description: Open project PR state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProjectPrStatus'
    post:
      tags: [Projects]
      summary: Same as PUT /api/projects/v2/projects/{slug}/pr
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/ProjectSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicProjectPrRequest'
      responses:
        '200':
          description: Open project PR state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProjectPrStatus'
  /api/admin/users:
    get:
      tags: [Admin]
      summary: List user summaries
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserData'
        '400':
          description: Missing client context
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
  /api/admin/actions:
    get:
      tags: [Admin]
      summary: List schema-described admin actions
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Available admin actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionsResponse'
        '401':
          description: Unauthorized or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
  /api/admin/actions/{actionId}:
    post:
      tags: [Admin]
      summary: Run one admin action
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRunRequest'
      responses:
        '200':
          description: Action result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionRunResponse'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
        '401':
          description: Unauthorized or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
  /api/admin/users/{email}:
    get:
      tags: [Admin]
      summary: Get one permission record
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Permission record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '400':
          description: Missing email
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
        '401':
          description: Unauthorized or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
    patch:
      tags: [Admin]
      summary: Merge a permission patch into one user
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
        - name: email
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionPatch'
      responses:
        '200':
          description: Updated permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '400':
          description: Invalid body or missing email
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
        '401':
          description: Unauthorized or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
    delete:
      tags: [Admin]
      summary: Delete one permission record
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: Missing email
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
        '401':
          description: Unauthorized or invalid session
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
  /auth/passkey/register/options:
    post:
      tags: [Passkeys]
      summary: Create WebAuthn registration options
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyNameRequest'
      responses:
        '200':
          description: Registration options
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing client context or passkey configuration
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
        '401':
          description: Missing or invalid session/challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
        '409':
          description: Passkey limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMessageError'
  /auth/passkey/register/verify:
    post:
      tags: [Passkeys]
      summary: Verify passkey registration
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/ChallengeCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyVerifyRequest'
      responses:
        '200':
