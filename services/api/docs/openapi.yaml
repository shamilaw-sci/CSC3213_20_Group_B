components:
  parameters:
    XClientId:
      name: X-Client-Id
      in: header
      required: true
      schema:
        type: string
        enum: [portal]
    SessionCookie:
      name: Cookie
      in: header
      required: false
      schema:
        type: string
      description: Cookie header carrying the session token.
    ChallengeCookie:
      name: Cookie
      in: header
      required: false
      schema:
        type: string
      description: Cookie header carrying passkey_challenge.
    OriginHeader:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      description: Must match one of the allowed portal origins.
    ProjectSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  schemas:
    ErrorObject:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]
      additionalProperties: true
    CodeMessageError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]
      additionalProperties: true
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    TokenResponse:
      type: object
      properties:
        token:
          type: string
      required: [token]
    MagicCodeSentResponse:
      type: object
      properties:
        message:
          type: string
        expiresIn:
          type: integer
      required: [message, expiresIn]
    VerifyResponse:
      type: object
      properties:
        valid:
          type: boolean
        email:
          type: string
        role:
          $ref: '#/components/schemas/AppRole'
      required: [valid, email]
    AppRole:
      type: string
      enum: [USER, OTHER, STUDENT, ACADEMIC, NON_ACADEMIC, ACADEMIC_SUPPORT]
    AccessLevel:
      type: string
      enum: [NONE, ADMIN, SUPER_ADMIN]
    SignupRequest:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        picture:
          type: string
      required: [email]
      additionalProperties: true
    MagicCodeRequest:
      type: object
      properties:
        email:
          type: string
      required: [email]
      additionalProperties: true
    MagicCodeVerifyRequest:
      type: object
      properties:
        email:
          type: string
        code:
          type: string
      required: [email, code]
      additionalProperties: true
    NotificationPatchRequest:
      type: object
      properties:
        notifications:
          type: object
          properties:
            email:
              type: boolean
            push:
              type: boolean
          additionalProperties: false
      required: [notifications]
      additionalProperties: false
    ProfilePictureMode:
      type: string
      enum: [google, github, manual, gravatar]
    ProfilePatchRequest:
      type: object
      properties:
        name:
          type: string
        pictureMode:
          $ref: '#/components/schemas/ProfilePictureMode'
        picture:
          type: string
          description: Manual custom image URL. The URL does not need a file extension; the API verifies PNG, JPEG, or WebP by Content-Type.
        gravatarMail:
          type: string
          description: Custom Gravatar email. Omit or send null to use the university email.
      required: [name]
      additionalProperties: false
    PublicProfileKind:
      type: string
      enum: [academic, academic-support, non-academic, student]
    PublicProfileSpecialStream:
      type: string
      enum:
        [
          biomedical-science,
          botany,
          computer-science,
          data-science,
          geology,
          mathematics,
          microbiology,
          molecular-biology,
          physics,
          statistics,
          zoology,
          applied-science,
          statistics-and-operations-research,
        ]
      description: Honours stream used only when profileKind is student and the submitted profile has studentTrack HONOURS.
    PublicProfileSchemaResponse:
      type: object
      properties:
        allowedKinds:
          type: array
          items:
            $ref: '#/components/schemas/PublicProfileKind'
        specialStreams:
          type: array
          items:
            $ref: '#/components/schemas/PublicProfileSpecialStream'
        note:
          type: string
      required: [allowedKinds, specialStreams, note]
    PublicProfilePrStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - none
            - open
            - merged
            - closed
            - checks_pending
            - checks_failed
            - auto_merge_queued
        number:
          type: integer
        url:
          type: string
        branch:
          type: string
        canEdit:
          type: boolean
      required: [status, canEdit]
      additionalProperties: true
    PublicProfilePrRequest:
      type: object
      properties:
        profileKind:
          $ref: '#/components/schemas/PublicProfileKind'
        stream:
          $ref: '#/components/schemas/PublicProfileSpecialStream'
        profile:
          type: object
          additionalProperties: true
      required: [profileKind, profile]
      additionalProperties: false
    PublicProjectResponse:
      type: object
      properties:
        project:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        targetProjectFile:
          type: string
        targetAggregateFile:
          type: string
        targetManifestFile:
          type: string
      required: [project]
      additionalProperties: true
    PublicProjectSchemaResponse:
      type: object
      properties:
        canSubmitOwnedProjects:
          type: boolean
        canSubmitAnyProject:
          type: boolean
        identity:
          type: object
          additionalProperties: true
        lockedFields:
          type: array
          items:
            type: string
        note:
          type: string
      required:
        - canSubmitOwnedProjects
        - canSubmitAnyProject
        - identity
        - lockedFields
        - note
    PublicProjectPrStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - none
            - open
            - merged
            - closed
            - checks_pending
            - checks_failed
            - auto_merge_queued
        number:
          type: integer
        url:
          type: string
        branch:
          type: string
        canEdit:
          type: boolean
      required: [status, canEdit]
      additionalProperties: true
    PublicProjectPrRequest:
      type: object
      properties:
        project:
          type: object
          additionalProperties: true
      required: [project]
      additionalProperties: false
    UserPermissionPatchRequest:
      type: object
      properties:
        email:
          type: string
        permission:
          $ref: '#/components/schemas/PermissionPatch'
      required: [email, permission]
      additionalProperties: false
    PermissionPatch:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/AppRole'
        accessLevel:
          $ref: '#/components/schemas/AccessLevel'
        include:
          type: object
          additionalProperties:
            type: string
        exclude:
          type: array
          items:
            type: string
        proxy:
          $ref: '#/components/schemas/ProxyEntry'
        blacklisted:
          type: boolean
        githubUserID:
          type: integer
        notifications:
          type: object
          properties:
            email:
              type: boolean
            push:
              type: boolean
          additionalProperties: false
        lastPasswordChanged:
          type: integer
        oAuthProviders:
          type: object
          properties:
            google:
              type: boolean
            github:
              type: boolean
          additionalProperties: false
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyCredential'
        name:
          type: string
        picture:
          type: string
        pictureMode:
          $ref: '#/components/schemas/ProfilePictureMode'
        gravatarMail:
          type: string
        createdAt:
          type: integer
      additionalProperties: true
    Permission:
      allOf:
        - $ref: '#/components/schemas/PermissionPatch'
      required: [role]
    UserData:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        picture:
          type: string
        role:
          $ref: '#/components/schemas/AppRole'
        accessLevel:
          $ref: '#/components/schemas/AccessLevel'
        blacklisted:
          type: boolean
        createdAt:
          type: integer
      required: [id, email, name, picture, role, accessLevel, blacklisted]
    ProxyEntry:
      type: object
      properties:
        proxyUrl:
          type: string
        active:
          type: boolean
        availableAttempts:
          type: integer
        updatedAt:
          type: integer
        editedBy:
          oneOf:
            - type: string
            - type: 'null'
      required: [proxyUrl, active, availableAttempts, updatedAt, editedBy]
    AdminProxyEntry:
      allOf:
        - $ref: '#/components/schemas/ProxyEntry'
        - type: object
          properties:
