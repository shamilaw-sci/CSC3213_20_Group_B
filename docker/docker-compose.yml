services:
  # ===========================================================================
  # SHARED CONFIG
  # ===========================================================================

  x-common: &common
    volumes:
      - .:/workspace
      - /workspace/node_modules

    restart: unless-stopped

  x-next-common: &next-common
    volumes:
      - .:/workspace
      - /workspace/node_modules

    restart: unless-stopped

    environment:
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
      PORT: 3000

  # ===========================================================================
  # NEXT.JS APPS
  # ===========================================================================

  main-site:
    <<: *next-common

    container_name: main-site

    build:
      context: .
      dockerfile: next.Dockerfile
      args:
        APP_NAME: main-site

    ports:
      - '3001:3000'

  portal:
    <<: *next-common

    container_name: portal-site

    build:
      context: .
      dockerfile: next.Dockerfile
      args:
        APP_NAME: portal

    ports:
      - '3002:3000'

  people:
    <<: *next-common

    container_name: people-site

    build:
      context: .
      dockerfile: next.Dockerfile
      args:
        APP_NAME: people

    ports:
      - '3003:3000'

  projects:
    <<: *next-common

    container_name: projects-site

    build:
      context: .
      dockerfile: next.Dockerfile
      args:
        APP_NAME: projects

    ports:
      - '3004:3000'

  # ===========================================================================
  # HONO / BUN APPS
  # ===========================================================================

  api:
    <<: *common

    container_name: api-server

    build:
      context: .
      dockerfile: hono.Dockerfile
      args:
        APP_NAME: api

    ports:
      - '3000:3000'

    environment:
      PORT: 3000

  github-app:
    <<: *common

    container_name: github-app

    build:
      context: .
      dockerfile: hono.Dockerfile
      args:
        APP_NAME: github-app

    ports:
      - '8789:3000'

    environment:
      PORT: 3000

  # ===========================================================================
  # CLOUDFLARE WORKERS
  # ===========================================================================

  auth-worker:
    <<: *common

    container_name: auth-worker

    build:
      context: .
      dockerfile: worker.Dockerfile
      args:
        APP_NAME: auth-worker

    ports:
      - '8787:8787'

    environment:
      NODE_OPTIONS: ''
      PORT: 8787

  proxy-worker:
    <<: *common

    container_name: proxy-worker

    build:
      context: .
      dockerfile: worker.Dockerfile
      args:
        APP_NAME: proxy-worker

    ports:
      - '8788:8787'

    environment:
      NODE_OPTIONS: ''
      PORT: 8787
